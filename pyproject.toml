[project]
name = "okapi-python"
version = "0.1.0"
description = "A client library for accessing OKAPI"
authors = []
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "httpx>=0.23.0,<0.29.0",
    "attrs>=22.2.0",
    "python-dateutil>=2.8.0,<3",
]

[tool.uv.build-backend]
module-name = "okapi_python"
module-root = ""

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
# 0.29 generates typing.Self, which needs Python 3.11; the package supports 3.10.
dev = [
    "openapi-python-client>=0.28.4,<0.29",
    "pytest>=8",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "I", "UP"]
